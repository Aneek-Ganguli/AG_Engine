name: Build Vulkan Project (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Check out your source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Fetch Dependencies (GLFW, GLM, and stb_image.h)
      - name: Fetch Dependencies
        run: |
          mkdir -p lib/stb
          git clone --depth 1 https://github.com/glfw/glfw.git lib/glfw
          git clone --depth 1 https://github.com/g-truc/glm.git lib/glm
          curl -sSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o lib/stb/stb_image.h
      # 3. Install Vulkan SDK 1.3
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.296.0'
          cache: true

      # 4. Configure CMake in Release mode
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # 5. Compile the library and executable
      - name: Build Project
        run: cmake --build build --config Release

      # 6. Upload build outputs as artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-project-macos-artifacts
          path: |
            build/*.a
            build/VulkanApp
            build/lib/*.a
